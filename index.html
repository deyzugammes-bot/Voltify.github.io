<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>Voltify</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        html, body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none !important;
            overscroll-behavior: none !important;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -webkit-interpolation-mode: nearest-neighbor;
            display: block;
            touch-action: none !important;
        }
    </style>
</head>

<body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <canvas id="canvas" width="180" height="320" draggable="false" oncontextmenu="return false;" onselectstart="return false;">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
    </div>

    <!-- Завантаження скрипту гри -->
    <script type="text/javascript" src="html5game/Voltify.js?cachebust=303040381"></script>

    <script>
        // 1. БЛОКУЄМО СКРОЛ ТА КОНТЕКСТНЕ МЕНЮ
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
        window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

        const canvas = document.getElementById('canvas');

        // 2. ГОЛОВНИЙ ФІКС ЗАРАДИ МИТТЄВОГО КЛІКУ:
        // Перетворюємо touchstart на негайний mousedown для GameMaker
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault(); // Прибираємо 300мс затримку браузера!

            // Розблоковуємо аудіо-потік
            if (typeof g_WebAudioContext !== 'undefined' && g_WebAudioContext && g_WebAudioContext.state === 'suspended') {
                g_WebAudioContext.resume();
            }

            // Передаємо синтезований клік миші прямо в полотно
            if (e.touches.length > 0) {
                var touch = e.touches[0];
                var mouseEvent = new MouseEvent("mousedown", {
                    clientX: touch.clientX,
                    clientY: touch.clientY,
                    button: 0
                });
                canvas.dispatchEvent(mouseEvent);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', function(e) {
            e.preventDefault();
            var mouseEvent = new MouseEvent("mouseup", { button: 0 });
            canvas.dispatchEvent(mouseEvent);
        }, { passive: false });

        window.onload = function() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();
                    if (tg.disableVerticalSwipes) {
                        tg.disableVerticalSwipes();
                    }
                }
            } catch(e) {}

            if (typeof GameMaker_Init === "function") {
                GameMaker_Init();
            }
        };
    </script>
</body>
</html>
