<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta charset="utf-8"/>
        <meta http-equiv="pragma" content="no-cache"/>

        <title>Voltify</title>

        <!-- Telegram WebApp SDK -->
        <script src="https://telegram.org/js/telegram-web-app.js"></script>

        <style>
            html, body {
                background: #000000;
                color: #cccccc;
                margin: 0px;
                padding: 0px;
                border: 0px;
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
                touch-action: none;
                -webkit-user-select: none;
                user-select: none;
            }

            #gm4html5_div_id {
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            canvas {
                image-rendering: optimizeSpeed;
                image-rendering: pixelated;
                image-rendering: crisp-edges;
                image-rendering: -webkit-optimize-contrast;
                -webkit-interpolation-mode: nearest-neighbor;
                -ms-touch-action: none;
                touch-action: none;
                margin: 0px;
                padding: 0px;
                border: 0px;
                max-width: 100%;
                max-height: 100%;
                width: 100vw !important;
                height: 100vh !important;
                object-fit: contain;
                display: block;
            }

            :-webkit-full-screen #canvas { width: 100%; height: 100%; }
            :-webkit-full-screen { width: 100%; height: 100%; }
        </style>
    </head>

    <body>
        <div class="gm4html5_div_class" id="gm4html5_div_id">
            <canvas id="canvas" width="180" height="320">
                <p>Your browser doesn't support HTML5 canvas.</p>
            </canvas>
        </div>

        <!-- Run the game code -->
        <script type="text/javascript" src="html5game/Voltify.js?cachebust=303040381"></script>

        <script>
            window.onload = function() {
                // Ініціалізація Telegram Mini App
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand(); // Розгортаємо гра на весь екран
                }
                
                // Запуск гри GameMaker
                if (typeof GameMaker_Init === "function") {
                    GameMaker_Init();
                }
            };
        </script>
    </body>
</html>
