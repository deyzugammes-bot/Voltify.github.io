<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <!-- Жорсткий лок зуму -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>Voltify</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* 1. ПОВНІСТЮ ВБИВАЄМО БРАУЗЕРНІ ЖЕСТИ І ВИДІЛЕННЯ */
        * {
            -webkit-touch-callout: none !important; /* Вбиває меню при довгому натисканні */
            -webkit-user-select: none !important;   /* Забороняє виділяти екран */
            -khtml-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: transparent !important; /* Прибирає синій квадрат при тапі */
            -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
            -webkit-user-drag: none !important; /* Забороняє "тягнути" канвас як картинку */
            outline: none !important;
        }

        html, body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none !important; /* Блокує всі браузерні свайпи */
            overscroll-behavior: none !important; /* Забороняє "гумовий" ефект сторінки */
        }

        #gm4html5_div_id {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -webkit-interpolation-mode: nearest-neighbor;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain;
            display: block;
            touch-action: none !important; /* КРИТИЧНО ДЛЯ ГРИ */
        }
    </style>
</head>

<body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <canvas id="canvas" width="180" height="320" draggable="false" oncontextmenu="return false;">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
    </div>

    <!-- Завантаження скрипту гри -->
    <script type="text/javascript" src="html5game/Voltify.js?cachebust=303040381"></script>

    <script>
        // =======================================================
        // 2. ЖОРСТКЕ БЛОКУВАННЯ БРАУЗЕРНИХ ЗААТРИМОК (JS-РІВЕНЬ)
        // =======================================================

        // Вбиваємо контекстне меню (зупиняє фріз при довгому затисканні)
        window.oncontextmenu = function(e) { e.preventDefault(); e.stopPropagation(); return false; };
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; });

        // Блокуємо спробу браузера "почати виділення" тексту чи об'єктів
        document.addEventListener('selectstart', function(e) { e.preventDefault(); });

        // Блокуємо подвійний тап (зупиняє затримку перевірки на зум)
        document.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });

        // Вбиваємо скрол браузера, віддаючи всі рухи виключно в GameMaker
        document.addEventListener('touchmove', function(e) { 
            e.preventDefault(); 
        }, { passive: false });

        // Розблокування аудіо
        function unlockAudio() {
            if (typeof g_WebAudioContext !== 'undefined' && g_WebAudioContext) {
                if (g_WebAudioContext.state === 'suspended') {
                    g_WebAudioContext.resume();
                }
            }
        }
        document.addEventListener('touchstart', unlockAudio, { passive: true });

        // =======================================================
        // 3. ІНІЦІАЛІЗАЦІЯ TELEGRAM ТА ГРИ
        // =======================================================
        window.onload = function() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();
                    if (tg.disableVerticalSwipes) {
                        tg.disableVerticalSwipes(); // Блокує закриття Телеграму при свайпі вниз
                    }
                }
            } catch(e) {}

            if (typeof GameMaker_Init === "function") {
                GameMaker_Init();
            }
        };
    </script>
</body>
</html>
