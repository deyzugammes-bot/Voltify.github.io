<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>Voltify</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* ЯДЕРНА БЛОКІРОВКА ВСЬОГО БРАУЗЕРНОГО СМІТТЯ */
        * {
            -webkit-touch-callout: none !important; /* Вбиває меню на iOS при затисканні */
            -webkit-user-select: none !important;   /* Вбиває виділення тексту Safari */
            -moz-user-select: none !important;      /* Firefox */
            -ms-user-select: none !important;       /* Edge/IE */
            user-select: none !important;           /* Стандартна заборона виділення */
            -webkit-tap-highlight-color: transparent !important; /* Вбиває синій спалах */
            outline: none !important;               /* Вбиває рамку фокусу */
        }

        html, body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none !important;          /* Забороняє зум і скрол */
            overscroll-behavior: none !important;   /* Забороняє "гумові" відскоки */
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -webkit-interpolation-mode: nearest-neighbor;
            display: block;
            touch-action: none !important;
            transform: translateZ(0);               /* Включає апаратне прискорення */
        }
    </style>
</head>

<body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <canvas id="canvas" width="180" height="320">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
    </div>

    <!-- Завантаження скрипту гри -->
    <script type="text/javascript" src="html5game/Voltify.js?cachebust=303040381"></script>

<script>
        // ========================================================
        // АБСОЛЮТНИЙ ЗАХИСТ ВІД РІДНОГО ДОДАТКУ ТЕЛЕГРАМУ
        // ========================================================
        
        const preventTelegram = function(e) {
            // Зупиняє дію браузера і НЕ ДАЄ дотику пройти в чат Телеграму
            e.preventDefault();
        };

        // Ловимо дотик пальця
        document.addEventListener('touchstart', preventTelegram, { passive: false });
        // Ловимо рух пальця (перетягування)
        document.addEventListener('touchmove', preventTelegram, { passive: false });
        // Блокуємо спробу викликати меню "Копіювати/Вставити"
        document.addEventListener('contextmenu', preventTelegram, { passive: false });
        // Блокуємо будь-яке виділення тексту
        document.addEventListener('selectstart', preventTelegram, { passive: false });

        window.onload = function() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand(); // Розгортаємо на весь екран
                    
                    // Забороняємо Телеграму закривати гру свайпом вниз
                    if (tg.disableVerticalSwipes) {
                        tg.disableVerticalSwipes();
                    }
                }
            } catch(e) {}

            // Запуск самої гри
            if (typeof GameMaker_Init === "function") {
                GameMaker_Init();
            }
        };
    </script>
</body>
</html>
