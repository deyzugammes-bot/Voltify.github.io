<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>Voltify</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            overscroll-behavior: none; /* Забороняємо Телеграму тягати екран */
        }

        /* Видалили object-fit та width/height, тепер GM сам керує розміром! */
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -webkit-interpolation-mode: nearest-neighbor;
            display: block;
            touch-action: none;
        }
    </style>
</head>

<body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <canvas id="canvas" width="180" height="320">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
    </div>

    <!-- Завантаження скрипту гри -->
    <script type="text/javascript" src="html5game/Voltify.js?cachebust=303040381"></script>

    <script>
        // Жорстко блокуємо спроби браузера скролити сторінку пальцем
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        window.onload = function() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();
                    
                    // Найголовніше: забороняємо Телеграму перехоплювати свайпи!
                    if (tg.disableVerticalSwipes) {
                        tg.disableVerticalSwipes();
                    }
                }
            } catch(e) {}

            if (typeof GameMaker_Init === "function") {
                GameMaker_Init();
            }
        };
    </script>
</body>
</html>
