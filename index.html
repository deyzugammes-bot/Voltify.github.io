<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <!-- Жорстко фіксуємо масштаб -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>Voltify</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* БЛОКУЄМО СИСТЕМНЕ ВИДІЛЕННЯ ТА ЖЕСТИ НА ВСІХ РІВНЯХ */
        * {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -khtml-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-tap-highlight-color: rgba(0,0,0,0) !important;
            outline: none !important;
        }

        /* РОБИМО ФОН ЧОРНИМ І БЛОКУЄМО ПОВЕДІНКУ БРАУЗЕРА */
        html, body {
            background-color: #000000 !important; /* Ніякої прозорості */
            color: transparent;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed; /* Намертво фіксує екран на одному місці */
            top: 0; left: 0; right: 0; bottom: 0;
            touch-action: none !important; 
            overscroll-behavior: none !important;
        }

        #gm4html5_div_id {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -webkit-interpolation-mode: nearest-neighbor;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain;
            display: block;
            touch-action: none !important;
            pointer-events: auto;
        }
    </style>
</head>

<!-- Відключаємо системні меню безпосередньо в тегах -->
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">
    
    <div class="gm4html5_div_class" id="gm4html5_div_id">
        <canvas id="canvas" width="180" height="320" draggable="false" oncontextmenu="return false;">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
    </div>

    <script type="text/javascript" src="html5game/Voltify.js?cachebust=303040381"></script>

    <script>
        // Блокуємо спробу браузера перехопити клік для виділення чи зуму
        const preventNative = (e) => {
            if (e.target.tagName !== 'CANVAS') {
                e.preventDefault();
            }
        };
        
        document.addEventListener('contextmenu', preventNative, { passive: false });
        document.addEventListener('selectstart', preventNative, { passive: false });
        document.addEventListener('dblclick', preventNative, { passive: false });
        document.addEventListener('touchmove', preventNative, { passive: false });

      // Розблокування аудіо ТІЛЬКИ НА ПЕРШИЙ КЛІК
        function unlockAudio() {
            if (typeof g_WebAudioContext !== 'undefined' && g_WebAudioContext) {
                if (g_WebAudioContext.state === 'suspended') {
                    g_WebAudioContext.resume();
                }
                // 🚨 ОСЬ ЦЕЙ РЯДОК ВБИВАЄ МІКРО-ФРІЗИ ВІД ТАПІВ! 🚨
                // Після першого дотику скрипт самознищується і більше не гальмує гру
                document.removeEventListener('touchstart', unlockAudio);
            }
        }
        document.addEventListener('touchstart', unlockAudio, { passive: true });
       // =======================================================
        // 3. ІНІЦІАЛІЗАЦІЯ TELEGRAM ТА ГРИ
        // =======================================================
        window.onload = function() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    tg.ready();
                    tg.expand();
                    
                    tg.setBackgroundColor('#000000');
                    tg.setHeaderColor('#000000');
                    
                    if (tg.disableVerticalSwipes) {
                        tg.disableVerticalSwipes(); 
                    }
                }
            } catch(e) {}

            if (typeof GameMaker_Init === "function") {
                GameMaker_Init();
            }
        };
    </script>
</body>
</html>
