<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>Voltify</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <div id="gm4html5_div_id">
        <canvas id="canvas" width="180" height="320">
            <p>Your browser does not support HTML5 canvas.</p>
        </canvas>
    </div>

    <script type="text/javascript" src="html5game/Voltify.js"></script>
    <script>
        // Ініціалізація Telegram Mini App
        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand(); // Розгортаємо на весь екран
            }
        };
    </script>
</body>
</html>
